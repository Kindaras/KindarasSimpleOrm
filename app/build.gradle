plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kindaras.objectdatabase'
    compileSdk = 36

    defaultConfig {
        minSdk = 29
        targetSdk = 36
        versionCode = 4
        versionName = "1.2.1"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        dataBinding = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}

afterEvaluate {
    tasks.named("bundleReleaseAar") {
        doLast {
            def file = file("$buildDir/outputs/aar/app-release.aar")
            def newName = "ObjectDatabase-${android.defaultConfig.versionName}.aar"
            file.renameTo(new File(file.parent, newName))
        }
    }
}